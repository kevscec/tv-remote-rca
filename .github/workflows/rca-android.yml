name: RCA Android validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate fork source
        run: |
          git diff --check
          node dev/flows/check.js
      - name: Build and check phone app
        working-directory: app/gradle
        run: bash gradlew :android:assembleDebug :android:testDebugUnitTest :android:lintDebug --no-daemon --max-workers=2
      - name: Name test APK and record checksum
        run: |
          mkdir -p rca-artifact
          cp app/android/build/outputs/apk/debug/android-debug.apk rca-artifact/TV-Remote-RCA-debug.apk
          cd rca-artifact
          sha256sum TV-Remote-RCA-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-RCA-debug
          path: rca-artifact/
          retention-days: 14
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RCA-check-reports
          path: |
            app/android/build/reports/tests/
            app/android/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
